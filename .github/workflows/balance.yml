name: Game balance and replay regression
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: balance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/opening-pause.spec.ts tests/e2e/p2.spec.ts tests/e2e/countdown-voice.spec.ts tests/e2e/launch-presentation.spec.ts tests/e2e/finish-voice.spec.ts tests/e2e/countdown-load.spec.ts
      - run: npm run balance:check
      - run: npm run build
      - name: Preserve balance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balance-report
          path: artifacts/balance-check.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve browser failure context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-context
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
