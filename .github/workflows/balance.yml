name: Game release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: balance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
        env:
          SPINFORGE_BROWSER_SHARD: ${{ matrix.shard }}/4
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ matrix.shard }}
          path: |
            artifacts/release-verification.json
            artifacts/release-verification/
            artifacts/highlight-software-gpu-v0420.json
            artifacts/*-software-v0430.json
            artifacts/p0-resource-preflight-v0206.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve balance and model observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balance-report-${{ matrix.shard }}
          path: |
            artifacts/balance-check.json
            artifacts/balance-observation.json
            artifacts/balance-observation.md
            artifacts/model-balance-investigation.json
            artifacts/model-balance-investigation.md
            artifacts/mummy-boundary.json
            artifacts/mummy-boundary.md
            artifacts/mummy-boundary-pairs.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve browser failure context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-context-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
  acceptance:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-verification-*
          path: artifacts/release-shards
      - name: Verify exact full-suite coverage and source
        run: |
          npx playwright test --list --reporter=json > artifacts/release-test-list.json
          node --experimental-strip-types scripts/verify-release-shards.ts
      - name: Preserve combined full acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-acceptance
          path: |
            artifacts/release-verification-combined.json
            artifacts/release-test-list.json
          if-no-files-found: error
          retention-days: 14
