<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>精彩重播驗收</title>
<style>body{margin:0;background:#101927;color:#dfecf5;font:14px sans-serif}header{position:absolute;top:12px;left:16px;z-index:3;max-width:95vw}button{padding:8px;margin:3px}#stage{height:100vh}output{display:block}</style>
<header>精彩重播 · 原戰鬥姿勢紀錄<br><button id="burst">爆裂</button><button id="over">越界</button><button id="extreme">極限</button><button id="pause">暫停／繼續</button><button id="step">前進100ms</button><button id="finish">終結鏡位</button><button id="end">完整播放完畢</button><button id="sweep">全段取景檢查</button><button id="skip">跳過</button><button id="mute">靜音</button><output id="phase">選擇終結</output></header><div id="stage"></div>
<script type="module">
import * as THREE from 'three';import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{HighlightRecorder,HIGHLIGHT_RATE}from'/src/highlight.ts';import{getBey}from'/src/catalog.ts';import{createBattle,stepBattle,shout}from'/src/physics.ts';import examples from'/tests/fixtures/v4-combat.json';
const arena=new Arena(),sound=new Sound();arena.attach(document.querySelector('#stage'),'battle');const recorder=new HighlightRecorder();let source=null,clip=null,before='',paused=false,finishing=false,last=0,frames=[],geometries=[],peak=0,analyser,maxExtent=0;
function update(dt){if(!clip)return;const frame=clip.advance(dt);for(const e of frame.events){const hit=arena.event(e,frame.battle);sound.event(e,hit);}if(frame.phase==='finish'&&!finishing){finishing=true;arena.showHighlightFinish(frame.battle);sound.finish(frame.battle.result,HIGHLIGHT_RATE,true);}arena.draw(dt*HIGHLIGHT_RATE,frame.battle);document.querySelector('#phase').textContent=frame.done?'播放完畢':frame.phase==='finish'?'終結特寫':'追擊鏡位';}
document.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;const id=e.target.id;sound.unlock();if(!analyser){analyser=sound.ctx.createAnalyser();analyser.fftSize=1024;sound.master.connect(analyser);}
 if(id==='pause'){paused=!paused;return;}if(id==='mute'){sound.toggle();return;}
 if(id==='skip'){clip=null;arena.endHighlight();sound.stopEffects();document.querySelector('#phase').textContent='已跳過';return;}
 if(id==='step'){update(.1);return;}if(id==='finish'){update(Math.max(0,clip.leadSeconds-clip.age+.1));return;}if(id==='end'){update(clip.duration-clip.age);paused=true;return;}
 if(id==='sweep'){paused=true;maxExtent=0;let i=0;while(clip.age<clip.duration){update(1/60);if(i++%6===0){const b=window.highlightMetrics().bounds;maxExtent=Math.max(maxExtent,...b.flatMap(p=>p.slice(0,2).map(Math.abs)));}}return;}
 const ex=examples[id];if(!ex)return;recorder.reset();source=createBattle(...ex.beys.map(getBey),ex.launches,ex.seed);recorder.record(source);while(!source.result){for(const i of[0,1])if(ex.shouts[i].includes(source.tick))shout(source,i);stepBattle(source);recorder.record(source);}before=JSON.stringify(source);clip=recorder.clip(source);arena.setBeys(ex.beys.map(getBey));sound.stopEffects();finishing=false;paused=false;frames=[];peak=0;arena.beginHighlight(clip.advance(0).battle);geometries=arena.models.flatMap(g=>{const ids=[];g.traverse(o=>{if(o.isMesh)ids.push(o.geometry.uuid);});return ids;});update(0);
});
function frame(t){const elapsed=last?t-last:0;last=t;if(clip){if(!paused){frames.push(elapsed);update(Math.min(.1,elapsed/1000));}else arena.draw(0,clip.battle);}sound.update(clip?.battle??null,!!clip&&!paused&&!finishing,paused?null:'results');if(analyser){const d=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(d);peak=Math.max(peak,...d.map(Math.abs));}requestAnimationFrame(frame);}
window.highlightMetrics=()=>{
 const bounds=new THREE.Box3(),v=new THREE.Vector3(),m=new THREE.Matrix4();arena.camera.updateMatrixWorld();const ids=[];for(const g of arena.models){g.updateMatrixWorld(true);g.traverse(o=>{if(!o.isMesh||!o.visible)return;ids.push(o.geometry.uuid);const p=o.geometry.attributes.position;for(let instance=0;instance<(o.isInstancedMesh?o.count:1);instance++){if(o.isInstancedMesh){o.getMatrixAt(instance,m);m.premultiply(o.matrixWorld);}else m.copy(o.matrixWorld);for(let i=0;i<p.count;i++)bounds.expandByPoint(v.fromBufferAttribute(p,i).applyMatrix4(m).project(arena.camera));}});}
 return{age:clip?.age??0,duration:clip?.duration??0,lead:clip?.leadSeconds??0,maxExtent,shot:arena.highlightShot,positions:arena.models.map(g=>g.position.toArray()),camera:arena.camera.position.toArray(),quaternion:arena.camera.quaternion.toArray(),sourceStable:!source||before===JSON.stringify(source),geometryStable:ids.join()===geometries.join(),size:recorder.size,particles:arena.particles.length,cues:sound.cues.size,impacts:sound.impacts.size,dashes:sound.dashVoices.size,cueRates:[...sound.cues.keys()].map(s=>s.playbackRate.value),frames,peak,bounds:[bounds.min.toArray(),bounds.max.toArray()]};
};requestAnimationFrame(frame);
</script></html>
