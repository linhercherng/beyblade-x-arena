<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>陀螺特性演出驗收</title><style>body{margin:0;background:#101927;color:white;font:14px sans-serif}header{position:absolute;z-index:2;padding:12px}button{padding:9px;margin:3px}#stage{height:100vh}output{display:block}</style><header><button id="attack">攻擊與左旋</button><button id="defense">防禦與持久</button><button id="balance">平衡切換</button><button id="special">橡膠與自由環</button><button id="matched">同向旋轉</button><button id="reverse">交換左右旋</button><button id="bound">金屬與彈簧</button><button id="dash">專屬衝刺</button><button id="hit">碰撞</button><button id="switch">加速</button><button id="pause">暫停</button><output></output></header><div id="stage"></div><script type="module">
import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{getBey}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';
const arena=new Arena(),sound=new Sound();arena.attach(document.querySelector('#stage'),'battle');let battle,paused=false,last=0;const frames=[],ids=arena.traitRings.map(r=>r.geometry.uuid);
const pairs={attack:['bx-01-dran-sword','bx-34-cobalt-dragoon'],defense:['bx-04-knight-shield','ux-03-wizard-rod'],balance:['bx-15-leon-claw','bx-02-hells-scythe'],special:['bx-00-storm-pegasus','ux-08-silver-wolf'],matched:['bx-01-dran-sword','bx-23-phoenix-wing'],reverse:['bx-34-cobalt-dragoon','bx-01-dran-sword'],bound:['ux-05-shinobi-shadow','ux-10-knight-mail']};
function select(key){const beys=pairs[key].map(getBey);arena.setBeys(beys);battle=createBattle(...beys,[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);battle.tops.forEach((t,i)=>Object.assign(t,{x:i?1.3:-1.3,z:0,vx:key==='balance'?.3:i?.5:4,vz:0,tilt:0}));document.querySelector('output').textContent=beys.map(b=>b.zhName+' · '+b.bit).join(' 對 ');paused=false;}
let dashRates=[];select('attack');document.addEventListener('click',e=>{const id=e.target.id;if(e.target.tagName!=='BUTTON')return;sound.unlock();if(pairs[id])select(id);if(id==='pause')paused=!paused;if(id==='switch')battle.tops.forEach(t=>t.vx=5);if(id==='dash'){
 battle.tops.forEach((t,i)=>{const a=.55+i*Math.PI;Object.assign(t,{x:Math.cos(a)*3.55,z:Math.sin(a)*3.55,vx:-Math.cos(a)*8,vz:-Math.sin(a)*8,dashUntil:battle.time+.7});const e={type:'dash',x:t.x,z:t.z,player:i,strength:1,time:battle.time};arena.event(e,battle);sound.event(e,false,undefined,battle);});
 dashRates=[...sound.dashVoices.values()].map(v=>v.source.playbackRate.value);arena.draw(.03,battle);battle.time+=.03;battle.tops.forEach(t=>{t.x+=t.vx*.03;t.z+=t.vz*.03;});arena.draw(.03,battle);paused=true;
 }if(id==='hit'){const e={type:'hit',x:0,z:0,strength:10,player:0,time:battle.time};arena.event(e,battle);sound.event(e,false,undefined,battle);arena.draw(.035,battle);paused=true;}});
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);if(last&&frames.length<300)frames.push(now-last);last=now;if(!paused){battle.time+=dt;battle.tops.forEach((t,i)=>t.rotation+=(i?-1:1)*35*dt);}arena.draw(paused?0:dt,battle);sound.update(battle,!paused,'battle');requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.identityArena=arena;window.identitySound=sound;window.identityDashRates=()=>dashRates;
window.effectMetrics=()=>({rings:arena.traitRings.map(r=>({visible:r.visible,mode:r.userData.mode,opacity:r.material.opacity,color:r.material.color.getHexString(),points:Array.from(r.geometry.attributes.position.array)})),profiles:arena.models.map(g=>g.userData.effects),waves:sound.rotors.map(r=>r.osc.type),particles:arena.particles.length,calls:arena.renderer.info.render.calls,stable:ids.join()===arena.traitRings.map(r=>r.geometry.uuid).join(),frames});
window.effectsDoNotMutate=()=>{const before=JSON.stringify(battle);arena.draw(0,battle);return JSON.stringify(battle)===before;};
</script></html>

<script>
window.identityMetrics=()=>({audioReady:window.identitySound?.ready,spin:window.identityArena?.renderer.domElement.dataset.spinContact,curls:window.identityArena?.particles.map(p=>p.curl??0),colors:window.identityArena?.particles.map(p=>p.color.getHexString()),rates:window.identityDashRates?.(),ribbon:window.identityArena?.dashRibbons.map(r=>({visible:r.visible,points:Array.from(r.geometry.attributes.position.array).slice(0,r.geometry.drawRange.count*3)}))});
</script>
