<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>材質終結混音驗收</title>
<button id="enable">啟用音訊</button><button id="stop">暫停／跳過</button><button id="mute">靜音</button><p>使用真實 Web Audio 與原廠組合資料，不寫入戰績。</p>
<script type="module">
import{Sound}from'/src/audio.ts';import{getBey}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';
const s=new Sound(),filters=new WeakMap(),live=new Set();let ready=false,maxLive=0,peak=0,meter,paused=false;
document.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;s.unlock();if(!ready&&s.ctx){ready=true;meter=s.ctx.createAnalyser();meter.fftSize=8192;s.master.connect(meter);const createFilter=s.ctx.createBiquadFilter.bind(s.ctx);s.ctx.createBiquadFilter=()=>{const filter=createFilter(),set=filter.frequency.setValueAtTime.bind(filter.frequency);filter.frequency.setValueAtTime=(value,time)=>{filter.startCutoff=value;return set(value,time);};return filter;};const create=s.ctx.createBufferSource.bind(s.ctx);s.ctx.createBufferSource=()=>{const source=create(),connect=source.connect.bind(source),start=source.start.bind(source),disconnect=source.disconnect.bind(source);const set=source.playbackRate.setValueAtTime.bind(source.playbackRate);source.playbackRate.setValueAtTime=(value,time)=>{source.startRate=value;return set(value,time);};source.connect=(node,...args)=>{if(node instanceof BiquadFilterNode)filters.set(source,node);return connect(node,...args);};source.start=(...args)=>{if([...s.cueBuffers.values()].includes(source.buffer)){live.add(source);maxLive=Math.max(maxLive,live.size);}return start(...args);};source.disconnect=(...args)=>{live.delete(source);return disconnect(...args);};source.addEventListener('ended',()=>live.delete(source));return source;};}if(e.target.id==='stop'){s.stopEffects();paused=true;}if(e.target.id==='mute')s.toggle();});
window.finishMaterial=(kind,material,rate=1,slow=false)=>{paused=false;const id={metal:'ux-05-shinobi-shadow',plastic:'bx-01-dran-sword',rubber:'bx-00-storm-pegasus'}[material],b=createBattle(getBey('bx-01-dran-sword'),getBey(id),[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);b.time=20;if(!slow)s.event({type:'hit',time:20,x:0,z:0,strength:12,player:0},true,0,b);b.result={winner:0,finish:kind,points:kind==='extreme'?3:kind==='spin'?1:2,time:20};if(slow)s.setReplay('finish');else s.setReplay(null);s.finish(b.result,rate,slow,.3,b);return window.finishMaterialMetrics();};
window.finishMaterialSound=s;window.finishMaterialMetrics=()=>({ready:s.countdownReady,clock:s.ctx?.currentTime??0,cache:s.cueBuffers.size,cues:[...s.cues.keys()].map(source=>({initialRate:source.startRate??source.playbackRate.value,rate:source.playbackRate.value,startCutoff:filters.get(source)?.startCutoff??filters.get(source)?.frequency.value,cutoff:filters.get(source)?.frequency.value,duration:source.buffer.duration,key:[...s.cueBuffers].find(([,b])=>b===source.buffer)?.[0]})),tails:s.cueTails?.size??0,live:live.size,maxLive,peak,musicDuck:s.musicDuck?.gain.value??1,sources:s.diagnostics().sources});
function frame(){s.update(null,false,paused?null:'results');if(meter){const a=new Float32Array(meter.fftSize);meter.getFloatTimeDomainData(a);for(const v of a)peak=Math.max(peak,Math.abs(v));}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
