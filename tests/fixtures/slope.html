<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>凹碗滑行與齒軌交接驗收</title><style>body{margin:0;background:#101927;color:white;font:14px sans-serif}header{position:absolute;z-index:2;padding:12px}button{padding:9px;margin:3px}#stage{height:100vh}small{display:block}</style><header><button id="rail">進入齒軌</button><button id="release">受撞解除</button><button id="approach">接近對手</button><button id="glide">滑回碗底</button><button id="reverse">受撞反向</button><button id="sweep">連續斜坡碰撞</button><button id="pause">暫停重繪</button><small>受控位置與碰撞輸入，不寫入戰績；每幀檢查真實模型貼盤</small></header><div id="stage"></div><script type="module">
import*as T from'three';import{Arena}from'/src/arena.ts';import{BEYS}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';import{stadiumSurface}from'/src/stadium-surface.ts';
const arena=new Arena();arena.setBeys([BEYS[0],BEYS.find(b=>b.id==='bx-34-cobalt-dragoon')]);arena.attach(document.querySelector('#stage'),'battle');let b,samples=[],stable=true;const n={x:Math.cos(.55),z:Math.sin(.55)},p=new T.Vector3();
function metrics(){return{positions:arena.models.map(g=>g.position.toArray()),up:arena.models.map(g=>new T.Vector3(0,1,0).applyQuaternion(g.quaternion).toArray()),centers:arena.models.map(g=>new T.Vector3(0,g.userData.effectHeight*g.scale.y,0).applyQuaternion(g.quaternion).add(g.position).toArray()),rails:arena.models.map(g=>g.userData.contact.railPoint.toArray()),gaps:arena.models.map(g=>{let gap=Infinity;for(const v of g.userData.contact.vertices){p.copy(v).applyQuaternion(g.quaternion).add(g.position);gap=Math.min(gap,p.y-stadiumSurface(Math.hypot(p.x,p.z)));}return gap;}),quaternions:arena.models.map(g=>g.quaternion.toArray()),state:JSON.stringify(b),stable,geometries:arena.models.map(g=>g.userData.parts.map(p=>p.uuid))};}
function draw(dt){const before=JSON.stringify(b);arena.draw(dt,b);stable&&=before===JSON.stringify(b);samples.push(metrics());}
function reset(){const beys=[BEYS[0],BEYS.find(b=>b.id==='bx-34-cobalt-dragoon')];arena.setBeys(beys);b=createBattle(...beys,[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);b.time=16;b.tops.forEach((t,i)=>Object.assign(t,{x:n.x*(i?-3.55:3.55),z:n.z*(i?-3.55:3.55),vx:-n.x*9,vz:-n.z*9,tilt:0,axisX:0,axisZ:0,rpm:.8}));samples=[];stable=true;draw(0);}
function hit(){arena.event({type:'hit',x:b.tops[0].x,z:b.tops[0].z,strength:6,player:0,time:b.time},b);draw(0);}
function rail(){reset();const t=b.tops[0];t.dashUntil=b.time+.65;arena.event({type:'dash',x:t.x,z:t.z,strength:1,player:0,time:b.time},b);for(let i=0;i<3;i++)draw(1/120);}
reset();document.addEventListener('click',e=>{const id=e.target.id;if(id==='rail')rail();if(id==='release')hit();if(id==='pause')draw(0);if(id==='reverse'){b.tops[0].vx*=-1;b.tops[0].vz*=-1;draw(1/120);}if(id==='glide')for(let i=0;i<20;i++){b.tops[0].x-=n.x*.06;b.tops[0].z-=n.z*.06;b.tops[0].rotation+=.4;draw(1/120);}if(id==='approach'){for(const d of [1.8,1.6,1.4,1.2,1,.8,.78]){b.tops[1].x=b.tops[0].x-n.x*d;b.tops[1].z=b.tops[0].z-n.z*d;draw(1/60);}hit();}if(id==='sweep'){reset();for(let i=0;i<48;i++){const r=3.5-2*Math.sin(i/47*Math.PI);b.tops.forEach((t,j)=>{t.x=r*Math.cos(.55+j*Math.PI);t.z=r*Math.sin(.55+j*Math.PI);t.rotation+=(j?-1:1)*.5;t.axisX=Math.sin(i*.4)*.2;t.axisZ=Math.cos(i*.4)*.2;});if(i===12||i===16)hit();draw(i===24?.05:1/60);}}});
window.slopeMetrics=()=>({...metrics(),samples});
</script></html>
