<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>衝刺命中終結銜接驗收</title>
<style>body{margin:0;background:#101927;color:#dfecf5;font:14px sans-serif}header{position:absolute;top:12px;left:16px;z-index:3;max-width:95vw}button{padding:8px;margin:3px}#stage{height:100vh}</style>
<header>衝刺命中 → 終結連貫演出<br><button id="burst">爆裂</button><button id="over">越界</button><button id="extreme">極限</button><button id="terminal">同一步決勝</button><button id="step">前進80ms</button><button id="end">前進至落盤</button><button id="play">播放</button><button id="pause">暫停／繼續</button><button id="mute">靜音</button><button id="whole">全場</button></header><div id="stage"></div>
<script type="module">
import * as THREE from 'three';import{fixtureProfile,batchDraw}from'./render-profile.ts';import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{BEYS}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';import{finishPlayback}from'/src/finish.ts';
const arena=new Arena(),sound=new Sound(),profile=fixtureProfile(arena);arena.attach(document.querySelector('#stage'),'battle');let battle=null,last=0,freeze=true,paused=false,beforeCamera=[],beforeFocus=[],rate=1,frames=[],peak=0,analyser,cached=false,snapshot='',stable=true;
const ringId=arena.hitRing.geometry.uuid;
function draw(dt){if(battle){const before=JSON.stringify(battle);arena.draw(dt,battle);stable&&=before===JSON.stringify(battle);}else arena.draw(dt);}
function start(kind,terminal=false){
 arena.setBeys([BEYS[0],BEYS[11]]);battle=createBattle(BEYS[0],BEYS[11],[{power:1,lane:0,angle:0},{power:1,lane:0,angle:0}],1);battle.time=20;
 battle.tops.forEach((t,i)=>Object.assign(t,{x:i?.45:-.45,z:0,rotation:0,vx:0,vz:0}));
 if(kind==='over')battle.tops.forEach((t,i)=>{t.x=i?4.05:3.15;});if(kind==='extreme')battle.tops.forEach((t,i)=>{t.x=0;t.z=i?4.05:3.15;});
 const warm=()=>{for(let i=0;i<90;i++)draw(1/60);};if(profile.softwareGpu)batchDraw(arena,warm);else warm();battle.tops[0].dashUntil=20.65;
 const finish={winner:0,finish:kind,points:kind==='extreme'?3:2,time:20};if(terminal)battle.result=finish;
 const event={type:'hit',x:(battle.tops[0].x+battle.tops[1].x)/2,z:(battle.tops[0].z+battle.tops[1].z)/2,strength:9,player:0,time:20};const hit=arena.event(event,battle);sound.event(event,hit);
 if(!terminal)for(let i=0;i<10;i++)draw(1/120);
 beforeCamera=arena.camera.position.toArray();beforeFocus=arena.cameraFocus.toArray();battle.result=finish;snapshot=JSON.stringify(battle);rate=arena.finish(battle);cached=sound.cueBuffers.has(kind);sound.finish(finish,rate,false,0,battle);draw(0);frames=[];peak=0;freeze=true;paused=false;
}
document.addEventListener('click',async e=>{if(e.target.tagName!=='BUTTON')return;const id=e.target.id;sound.unlock();while(!sound.countdownReady)await new Promise(requestAnimationFrame);sound.setMusicVolume(1);if(!analyser){analyser=sound.ctx.createAnalyser();analyser.fftSize=1024;sound.master.connect(analyser);}
 if(id==='pause'){paused=!paused;return;}if(id==='mute'){sound.toggle();return;}if(id==='whole'){arena.closeUp=false;return;}if(id==='play'){freeze=false;return;}
 if(id==='step'){draw(.08);return;}if(id==='end'){draw(1.65);return;}start(id==='terminal'?'extreme':id,id==='terminal');
});
function frame(t){const elapsed=last?t-last:0;last=t;if(!freeze&&!paused){frames.push(elapsed);draw(Math.min(.05,elapsed/1000));}else draw(0);sound.update(battle,false,paused?null:'battle');if(analyser){const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);peak=Math.max(peak,...data.map(Math.abs));}requestAnimationFrame(frame);}
window.chainMetrics=(withBounds=true)=>{
 const values={renderProfile:profile.info(),rate,cached,beforeCamera,beforeFocus,camera:arena.camera.position.toArray(),focus:arena.cameraFocus.toArray(),positions:arena.models.map(m=>m.position.toArray()),parts:arena.models.map(m=>m.userData.parts.map(p=>p.position.toArray())),time:arena.time,age:arena.time-arena.finishTime,elapsed:finishPlayback(arena.time-arena.finishTime,arena.finishRate),cueRates:[...sound.cues.keys()].map(s=>s.playbackRate.value),cues:sound.cues.size,tails:sound.impactTails.size,particles:arena.particles.length,ringStable:ringId===arena.hitRing.geometry.uuid,geometryCount:arena.renderer.info.memory.geometries,frames,peak,stable:stable&&(!battle||snapshot===JSON.stringify(battle))};if(!withBounds)return values;
 const bounds=new THREE.Box3(),v=new THREE.Vector3(),m=new THREE.Matrix4();arena.camera.updateMatrixWorld();const projection=new THREE.Matrix4().multiplyMatrices(arena.camera.projectionMatrix,arena.camera.matrixWorldInverse);for(const g of arena.models){g.updateMatrixWorld(true);g.traverse(o=>{if(!o.isMesh||!o.visible)return;const p=o.geometry.attributes.position;for(let instance=0;instance<(o.isInstancedMesh?o.count:1);instance++){if(o.isInstancedMesh){o.getMatrixAt(instance,m);m.premultiply(o.matrixWorld);}else m.copy(o.matrixWorld);m.premultiply(projection);for(let i=0;i<p.count;i++)bounds.expandByPoint(v.fromBufferAttribute(p,i).applyMatrix4(m));}});}
 return{...values,bounds:[bounds.min.toArray(),bounds.max.toArray()]};
};window.chainFrameCount=()=>frames.length;requestAnimationFrame(frame);
</script></html>
