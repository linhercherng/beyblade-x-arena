<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>摩擦音與姿態同步驗收</title><style>body{margin:0;background:#101927;color:white;font:14px sans-serif}header{position:absolute;z-index:2;padding:12px}button{padding:9px;margin:3px}#stage{height:100vh}</style><header><button id="slow">低速擦盤</button><button id="fast">穩定高速</button><button id="stop">側倒停轉</button><button id="pause">暫停</button><button id="resume">恢復</button><button id="mute">靜音切換</button><button id="skip">跳過</button><button id="seek">尾端定位</button><button id="background">切背景</button><button id="foreground">回前景</button></header><div id="stage"></div><script type="module">
import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{getBey}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';
const arena=new Arena(),sound=new Sound(),beys=['bx-01-dran-sword','bx-34-cobalt-dragoon'].map(getBey);arena.attach(document.querySelector('#stage'),'battle');let b,paused=false,last=0,analyser=null,peak=0,stable=true,serial=0;const ids=new WeakMap();
function select(rpm){arena.setBeys(beys);b=createBattle(...beys,[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);b.time=32;b.tops.forEach((t,i)=>Object.assign(t,{x:i?2.7:-2.7,z:.6,vx:0,vz:0,rpm,tilt:.7,axisX:0,axisZ:0,rotation:i?1:0}));paused=false;}
select(.8);document.addEventListener('click',e=>{const id=e.target.id;if(e.target.tagName!=='BUTTON')return;if(!['foreground','background'].includes(id))sound.unlock();if(!analyser&&sound.ctx){analyser=sound.ctx.createAnalyser();analyser.fftSize=1024;sound.sfx.connect(analyser);}if(id==='slow')select(.08);if(id==='fast')select(.8);if(id==='stop'&&!b.result){b.tops[1].rpm=0;b.result={winner:0,finish:'spin',points:1,time:32};arena.finish(b);sound.finish(b.result,1,false,0,b);}if(id==='pause')paused=true;if(id==='resume')paused=false;if(id==='mute')sound.toggle();if(id==='skip'){paused=true;sound.stopEffects();}if(id==='seek'){sound.stopEffects();arena.seekBattle(b);paused=true;}if(id==='background'){paused=true;sound.setBackground(true);}if(id==='foreground')sound.setBackground(false);});
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused&&!b.result)b.tops.forEach(t=>t.rotation+=(t.bey.spin==='L'?-1:1)*t.rpm*65*dt);const before=JSON.stringify(b);arena.draw(paused?0:dt,b);sound.update(b,!paused&&!b.result,paused?null:b.result?'results':'battle',false,arena.friction);stable&&=before===JSON.stringify(b);if(analyser){const a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);peak=Math.max(peak,...a.map(Math.abs));}requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.frictionSound=sound;window.frictionMetrics=()=>({frames:arena.friction.map(f=>({...f})),voices:[...sound.frictionVoices].map(([player,v])=>{if(!ids.has(v.source))ids.set(v.source,++serial);return{player,id:ids.get(v.source),gain:v.gain.gain.value,rate:v.source.playbackRate.value,closing:v.closing};}),time:arena.time,finishAge:b.result?arena.time-arena.finishTime:null,status:sound.status,muted:sound.muted,volume:sound.volume,musicGain:sound.music?.gain.value??0,mix:sound.frictionMix,master:sound.master?.gain.value??0,peak,stable,quaternions:arena.models.map(g=>g.quaternion.toArray()),cues:sound.cues.size});
</script></html>
