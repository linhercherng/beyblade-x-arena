<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>碰撞反彈與傾斜驗收</title><style>body{margin:0;background:#101927;color:white;font:14px sans-serif}header{position:absolute;z-index:2;padding:12px}button{padding:10px;margin:3px}#stage{height:100vh}small{display:block}</style><header><button id="light">低速擦碰</button><button id="head">正面衝撞</button><button id="opposed">左右旋接觸</button><button id="advance">推進40ms</button><button id="repeat">接續撞擊</button><button id="rapid">密集接觸</button><button id="rest">回穩</button><button id="reset">清除回饋</button><small>固定物理快照，隔離驗證碰撞呈現；按鈕啟用音效</small></header><div id="stage"></div><script type="module">
import*as THREE from'three';import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{getBey}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';import{stadiumSurface}from'/src/stadium-surface.ts';
const arena=new Arena(),sound=new Sound();arena.attach(document.querySelector('#stage'),'battle');let b,hit,lastFilter=null,disconnects=0;
function select(kind){const beys=['bx-01-dran-sword',kind==='opposed'?'bx-34-cobalt-dragoon':'bx-23-phoenix-wing'].map(getBey);arena.setBeys(beys);b=createBattle(...beys,[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);b.time=16;b.tops.forEach((t,i)=>Object.assign(t,{x:i?.39:-.39,z:0,vx:(i?1:-1)*(kind==='light'?.05:4),vz:kind==='light'?(i?2:-2):0,tilt:0,axisX:0,axisZ:0,rpm:.8}));hit={type:'hit',x:0,z:0,strength:kind==='light'?.5:14,player:0,time:16};lastFilter=null;arena.draw(0,b);}
function strike(){arena.event(hit,b);const create=sound.ctx.createBiquadFilter.bind(sound.ctx);sound.ctx.createBiquadFilter=()=>{const f=create(),disconnect=f.disconnect.bind(f);f.disconnect=(...args)=>{disconnects++;return disconnect(...args);};lastFilter=f;return f;};sound.event(hit,false,0,b);sound.ctx.createBiquadFilter=create;arena.draw(0,b);}
select('head');document.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;sound.unlock();const id=e.target.id;if(['light','head','opposed'].includes(id)){select(id);strike();}if(id==='advance')arena.draw(.04,b);if(id==='repeat')strike();if(id==='rapid')for(let i=0;i<30;i++)strike();if(id==='rest')arena.draw(.5,b);if(id==='reset')select('head');});
window.feedbackMetrics=()=>({up:arena.models.map(g=>new THREE.Vector3(0,1,0).applyQuaternion(g.quaternion).toArray()),quaternions:arena.models.map(g=>g.quaternion.toArray()),positions:arena.models.map(g=>g.position.toArray()),gaps:arena.models.map(g=>Math.min(...g.userData.contact.vertices.map(v=>{const p=v.clone().applyQuaternion(g.quaternion).add(g.position);return p.y-stadiumSurface(Math.hypot(p.x,p.z));}))),particles:arena.particles.length,shake:arena.shake,queue:arena.contactHits.length,gains:[...sound.impacts.values()].map(g=>g.gain.value),cutoff:lastFilter?.frequency.value,disconnects,voices:sound.impacts.size,state:JSON.stringify(b),geometries:arena.models.map(g=>g.userData.parts.map(p=>p.uuid))});
</script></html>
