<!doctype html><meta charset="utf-8"><title>Audio integration fixture</title>
<button id="menu">menu</button><button id="battle">battle</button><button id="clutch">clutch</button><button id="results">results</button><button id="pause">pause</button><button id="mute">mute</button>
<button id="recover">recover</button>
<input id="volume" type="range" min="0" max="1" step=".1" value=".6">
<script type="module">
import { Sound } from "/src/audio.ts";
const liveSources=new Set();
const create=AudioContext.prototype.createBufferSource;
AudioContext.prototype.createBufferSource=function(){
  const source=create.call(this),disconnect=source.disconnect.bind(source);liveSources.add(source);
  source.addEventListener("ended",()=>liveSources.delete(source));
  source.disconnect=(...args)=>{liveSources.delete(source);return disconnect(...args);};return source;
};
const sound = new Sound();
let mode = "menu", analyser;
document.addEventListener("click", e => {
  if(e.target.id!=="recover")sound.unlock();
  if (!analyser) { analyser = sound.ctx.createAnalyser(); sound.master.connect(analyser); }
  if(e.target.id==="recover"){sound.recoverAudio();return;}
  if (e.target.id === "mute") sound.toggle();
  else if (e.target.tagName === "BUTTON") mode = e.target.id === "pause" ? null : e.target.id;
});
document.querySelector("input").oninput = e => sound.setMusicVolume(Number(e.target.value));
function frame() { sound.update(null, false, mode); requestAnimationFrame(frame); }
frame();
window.audioSound = sound;
window.addEventListener("pagehide",()=>sound.setBackground(true));
window.addEventListener("pageshow",()=>sound.setBackground(false));
window.audioMetrics = () => {
  const values = new Float32Array(analyser?.fftSize ?? 0);
  analyser?.getFloatTimeDomainData(values);
  return { context: sound.ctx?.state ?? null, requested: sound.requested, playing: sound.playing?.mode ?? null,
    loops:[...liveSources].filter(s=>s.loop).length, sources:liveSources.size, master:sound.master?.gain.value??0,
    muted: sound.muted, volume: sound.volume, offset: sound.playing?.offset ?? 0,
    duration: sound.playing?.duration ?? 0, peak:Math.max(0,...values.map(Math.abs)), rms: Math.sqrt(values.reduce((s,v) => s+v*v,0) / (values.length || 1)) };
};
</script>
