<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>衝刺命中驗收</title>
<style>body{margin:0;background:#101927;color:#dfecf5;font:14px sans-serif}header{position:absolute;top:12px;left:16px;z-index:3;max-width:95vw}button{padding:9px;margin:3px}#stage{height:100vh}small{display:block}</style>
<header>極限衝刺命中 · 慢動作／近鏡／衝擊回饋<br><button id="capture">定格命中</button><button id="play">播放命中</button><button id="normal">一般播放</button><button id="rapid">持續密集命中</button><button id="pause">暫停／繼續</button><button id="whole">全場鏡頭</button><button id="finish">終結</button><button id="mute">靜音</button><button id="bgm">最大配樂</button><small>隔離顯示驗收，正式勝負由物理引擎決定</small></header><div id="stage"></div>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import{fixtureProfile,batchDraw}from'./render-profile.ts';import{Arena}from'/src/arena.ts';import{Sound}from'/src/audio.ts';import{BEYS}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';
const arena=new Arena(),sound=new Sound(),profile=fixtureProfile(arena);arena.attach(document.querySelector('#stage'),'battle');
let battle,paused=true,last=0,accepted=0,frames=[],scales=[],stressUntil=0,lastStress=-Infinity,meters,peakSfx=0,musicAtPeak=0,peakMix=0,baseline=0;
let pauseCancellation={active:0,stopped:0};
function reset(){battle=createBattle(BEYS[0],BEYS[11],[{power:1,lane:0,angle:0},{power:1,lane:0,angle:0}],1);arena.setBeys([BEYS[0],BEYS[11]]);battle.tops.forEach((t,i)=>Object.assign(t,{x:i?.44:-.44,z:0,vx:i?.03:-.03,vz:0}));const warm=()=>{for(let i=0;i<90;i++)arena.draw(1/60,battle);};if(profile.softwareGpu)batchDraw(arena,warm);else warm();baseline=arena.camera.position.distanceTo(arena.cameraFocus);accepted=0;frames=[];scales=[];stressUntil=0;peakSfx=musicAtPeak=peakMix=0;}
function hit(){battle.tops[0].dashUntil=battle.time+.65;const e={type:'hit',x:0,z:0,strength:9,player:0,time:battle.time};const yes=arena.event(e,battle);accepted+=Number(yes);sound.event(e,yes);}
function move(dt){battle.time+=dt;for(const [i,t]of battle.tops.entries()){t.rotation+=(i?-1:1)*45*dt;t.x+=t.vx*dt;}}
function rms(a){const d=new Float32Array(a.fftSize);a.getFloatTimeDomainData(d);return{rms:Math.sqrt(d.reduce((s,v)=>s+v*v,0)/d.length),peak:d.reduce((s,v)=>Math.max(s,Math.abs(v)),0)};}
document.addEventListener('click',e=>{
 if(e.target.tagName!=='BUTTON')return;const id=e.target.id;sound.unlock();
 if(!meters)meters=[sound.sfx,sound.musicDuck,sound.master].map(bus=>{const a=sound.ctx.createAnalyser();a.fftSize=512;bus.connect(a);return a;});
 if(id==='pause'){paused=!paused;if(paused){const probe=pauseCancellation={active:sound.impacts.size,stopped:0};for(const source of sound.impacts.keys()){const stop=source.stop.bind(source);let called=false;source.stop=(...args)=>{if(!called){called=true;probe.stopped++;}return stop(...args);};}}return;}if(id==='mute'){sound.toggle();return;}if(id==='bgm'){sound.setMusicVolume(1);return;}
 if(id==='whole'){arena.closeUp=false;reset();return;}
 if(id==='finish'){battle.result={winner:0,finish:'burst',points:2,time:battle.time};const rate=arena.finish(battle);sound.finish(battle.result,rate);return;}
 reset();if(id==='play')sound.event({type:'hit',x:0,z:0,strength:14,player:0,time:battle.time});if(id!=='normal')hit();paused=id==='capture';
 if(id==='capture')for(let i=0;i<10;i++){move(1/120*arena.playbackScale);arena.draw(1/120,battle);}
 if(id==='rapid')stressUntil=arena.time+3;
});
function frame(t){const elapsed=(t-last)||0,dt=Math.min(.05,elapsed/1000);last=t;
 if(!paused){if(stressUntil>arena.time&&arena.time-lastStress>.045){lastStress=arena.time;for(let i=0;i<12;i++)hit();}const scale=arena.playbackScale;move(dt*scale);arena.draw(dt,battle);scales.push(scale);if(stressUntil>arena.time)frames.push(elapsed);}else arena.draw(0,battle);
 sound.update(battle,!paused&&!battle.result,paused?null:'battle');
 if(meters){const s=rms(meters[0]),m=rms(meters[1]);if(s.rms>peakSfx){peakSfx=s.rms;musicAtPeak=m.rms;}peakMix=Math.max(peakMix,rms(meters[2]).peak);}requestAnimationFrame(frame);
}
const geometry=()=>[arena.hitRing,...arena.dashRibbons,...arena.trails].map(o=>o.geometry.uuid).join();let ids;
window.hitMetrics=(withBounds=true)=>{
 const values={renderProfile:profile.info(),time:arena.time,sim:battle.time,accepted,baseline,camera:arena.camera.position.toArray(),distance:arena.camera.position.distanceTo(arena.cameraFocus),quaternion:arena.camera.quaternion.toArray(),sample:arena.hitPlayback.sample(arena.time,arena.reduced),ring:{visible:arena.hitRing.visible,scale:arena.hitRing.scale.x,opacity:arena.hitRing.material.opacity},particles:arena.particles.length,geometryStable:ids===geometry(),impacts:sound.impacts.size,impactRates:[...sound.impacts.keys()].map(s=>s.playbackRate.value),duck:sound.musicDuck?.gain.value??1,playing:sound.playing?.mode,peakSfx,musicAtPeak,peakMix,frames,scales};if(!withBounds)return values;
 arena.camera.updateMatrixWorld();const bounds=new THREE.Box3(),v=new THREE.Vector3(),matrix=new THREE.Matrix4(),projection=new THREE.Matrix4().multiplyMatrices(arena.camera.projectionMatrix,arena.camera.matrixWorldInverse);
 for(const g of arena.models){g.updateMatrixWorld(true);g.traverse(o=>{if(!o.isMesh||!o.visible)return;const p=o.geometry.attributes.position;for(let instance=0;instance<(o.isInstancedMesh?o.count:1);instance++){if(o.isInstancedMesh){o.getMatrixAt(instance,matrix);matrix.premultiply(o.matrixWorld);}else matrix.copy(o.matrixWorld);matrix.premultiply(projection);for(let i=0;i<p.count;i++)bounds.expandByPoint(v.fromBufferAttribute(p,i).applyMatrix4(matrix));}});}
 return{...values,corners:[bounds.min.toArray(),bounds.max.toArray()]};
};window.hitPauseCancellation=()=>({...pauseCancellation,remaining:sound.impacts.size});window.hitProgress=()=>({remaining:Math.max(0,stressUntil-arena.time),frames:frames.length});reset();ids=geometry();requestAnimationFrame(frame);
</script></html>
