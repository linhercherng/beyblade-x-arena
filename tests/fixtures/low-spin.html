<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>低轉速失衡與停轉驗收</title><style>body{margin:0;background:#101927;color:white;font:14px sans-serif}header{position:absolute;z-index:2;padding:12px}button{padding:9px;margin:3px}#stage{height:100vh}small{display:block}</style><header><button id="fast">穩定旋轉</button><button id="slow">低轉速</button><button id="slope">斜坡左旋</button><button id="center">中心左旋</button><button id="right">斜坡右旋</button><button id="stop">停轉</button><button id="tick">推進40ms</button><button id="end">完成回穩</button><button id="pause">暫停重繪</button><button id="seek">重播尾端定位</button><button id="sweep">完整失衡側倒</button><small>受控轉速與終結快照；每幀檢查真實模型，不寫入戰績</small></header><div id="stage"></div><script type="module">
import*as T from'three';import{Arena}from'/src/arena.ts';import{getBey}from'/src/catalog.ts';import{createBattle}from'/src/physics.ts';import{stadiumSurface,stadiumNormal}from'/src/stadium-surface.ts';
const beys=['bx-01-dran-sword','bx-34-cobalt-dragoon'].map(getBey),arena=new Arena();arena.attach(document.querySelector('#stage'),'battle');let b,loser=1,samples=[],stable=true;const p=new T.Vector3(),normal=new T.Vector3();
function measure(){return{positions:arena.models.map(g=>g.position.toArray()),quaternions:arena.models.map(g=>g.quaternion.toArray()),up:arena.models.map(g=>new T.Vector3(0,1,0).applyQuaternion(g.quaternion).toArray()),inclines:arena.models.map((g,i)=>{stadiumNormal(b.tops[i].x,b.tops[i].z,normal);p.set(0,1,0).applyQuaternion(g.quaternion);return Math.acos(Math.max(-1,Math.min(1,p.dot(normal))));}),gaps:arena.models.map(g=>{let gap=Infinity;for(const v of g.userData.contact.vertices){p.copy(v).applyQuaternion(g.quaternion).add(g.position);gap=Math.min(gap,p.y-stadiumSurface(Math.hypot(p.x,p.z)));}return gap;}),parts:arena.models.map(g=>g.userData.parts.map(p=>p.position.toArray())),ids:arena.models.map(g=>g.userData.parts.map(p=>p.uuid)),particles:arena.particles.length,state:JSON.stringify(b),stable,loser};}
function draw(dt){const before=JSON.stringify(b);arena.draw(dt,b);stable&&=before===JSON.stringify(b);samples.push(measure());}
function reset(kind='slope'){loser=kind==='right'?0:1;arena.setBeys(beys);b=createBattle(...beys,[{power:.9,lane:1,angle:0},{power:.9,lane:1,angle:0}],7);b.time=32;b.tops.forEach((t,i)=>Object.assign(t,{x:i===loser?(kind==='center'?0:2.7):-1.2,z:i===loser?.5:0,vx:0,vz:0,rpm:kind==='fast'?.8:.08,tilt:.6,axisX:0,axisZ:0,rotation:.7}));if(kind==='center')b.tops[loser].z=0;samples=[];stable=true;draw(.016);}
function stop(){b.tops[loser].rpm=0;b.result={winner:1-loser,finish:'spin',points:1,time:32};arena.finish(b);draw(0);}
reset();document.addEventListener('click',e=>{const id=e.target.id;if(['fast','slow','slope','center','right'].includes(id))reset(id);if(id==='stop')stop();if(id==='tick')draw(.04);if(id==='end')draw(2);if(id==='pause')draw(0);if(id==='seek'){arena.seekBattle(b);draw(0);}if(id==='sweep'){reset();for(let i=0;i<60;i++){b.tops[loser].rpm=.28*(1-i/60);b.tops[loser].rotation-=b.tops[loser].rpm*65/60;draw(1/60);}stop();for(let i=0;i<100;i++)draw(i===30?.05:1/60);}});
window.lowSpinMetrics=()=>({...measure(),samples});
</script></html>
